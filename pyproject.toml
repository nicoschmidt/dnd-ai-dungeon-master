[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-ai-dungeon-master"
version = "0.0.0"
description = "An AI dungeon master for tabletop Dungeons & Dragons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The table's stream uses fastapi.sse; 0.141 is the oldest version tested.
    "fastapi>=0.141",
    "pydantic>=2.11",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Iteration 001's built-in fight: SRD and original content, see its PROVENANCE.md.
"dungeon_master.adventure" = ["fixtures/*.md", "fixtures/*/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
