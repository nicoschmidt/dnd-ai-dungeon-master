name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: |
          failed=0
          for script in scripts/*.sh; do
            if ! bash -n "$script"; then
              echo "::error file=$script::bash -n failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Script tests
        run: |
          failed=0
          for test in scripts/test-*.sh; do
            echo "== $test"
            if ! bash "$test"; then
              echo "::error file=$test::$test failed"
              failed=1
            fi
          done
          exit "$failed"
