name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax
        run: |
          failed=0
          for script in scripts/*.sh; do
            if ! bash -n "$script"; then
              echo "::error file=$script::bash -n failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Script tests
        run: |
          failed=0
          for test in scripts/test-*.sh; do
            echo "== $test"
            if ! bash "$test"; then
              echo "::error file=$test::$test failed"
              failed=1
            fi
          done
          exit "$failed"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The floor declared in pyproject.toml, so it stays true.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Tests, including the layer boundary
        run: pytest

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  adventure-content:
    name: Adventure content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No adventure content, binaries or fixtures without provenance
        run: bash scripts/check-no-adventure-content.sh

  # The one check the main ruleset requires. Every other job is listed in
  # `needs`; tests/test_ci_workflow.py fails when one is missing, so adding a
  # job never means touching the repository settings.
  ci-passed:
    name: CI passed
    # Without always(), a failed job would skip this one, and a skipped
    # required check counts as passed.
    if: always()
    needs: [scripts, backend, client, adventure-content]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "Not every job succeeded: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "every job succeeded"
